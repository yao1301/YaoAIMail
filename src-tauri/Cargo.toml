[package]
name = "pebble"
version = "1.1.21"
edition = "2021"

[lib]
name = "pebble_lib"
# Desktop build uses staticlib + rlib only.
# The `cdylib` type is required ONLY for mobile (Android/iOS) builds, where the
# Rust lib is loaded as a shared object by the native shell. It is intentionally
# omitted here: under the MinGW/GNU toolchain building a cdylib auto-exports
# every symbol and exceeds the PE 65535 export-ordinal limit (this app exports
# ~222k symbols), so the desktop .exe cannot be linked. Re-add cdylib only when
# targeting mobile and using a toolchain that supports it (e.g. MSVC).
crate-type = ["staticlib", "rlib"]

[dependencies]
base64 = "0.22"
tauri = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
chrono = "0.4"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
tokio = { workspace = true }
opener = "0.7"
pebble-core = { path = "../crates/pebble-core" }
pebble-store = { path = "../crates/pebble-store" }
pebble-privacy = { path = "../crates/pebble-privacy" }
pebble-mail = { path = "../crates/pebble-mail" }
pebble-search = { path = "../crates/pebble-search" }
pebble-rules = { path = "../crates/pebble-rules" }
pebble-translate = { path = "../crates/pebble-translate" }
pebble-crypto = { path = "../crates/pebble-crypto" }
pebble-oauth = { path = "../crates/pebble-oauth" }
tauri-plugin-notification = { version = "2", features = ["windows7-compat"] }
tauri-plugin-deep-link = "2"
lettre = { workspace = true }
reqwest = { workspace = true }
semver = { workspace = true }
rfd = "0.15"
quick-xml = "0.37.5"
scraper = "0.27.0"
pdf-extract = "0.12.0"
tauri-plugin-drag = "2.1.0"

[target.'cfg(windows)'.dependencies]
tauri-winrt-notification = "0.7"
windows-version = "0.1"
windows-registry = "0.5"
windows = { version = "0.52", features = [
    "Win32_System_Com",
    "Win32_System_Ole",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
] }

[target.'cfg(target_os = "linux")'.dependencies]
notify-rust = "4"

[target.'cfg(target_os = "macos")'.dependencies]
mac-notification-sys = "0.6"

[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
tauri-plugin-autostart = "2"

[build-dependencies]
tauri-build = { workspace = true }
