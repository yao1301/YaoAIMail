# Use lld as the linker backend instead of GNU ld. MinGW's ld 2.46 hits
# "export ordinal too large" and aborts when linking the large cdylib
# (pebble_lib.dll exports >65k symbols). lld has no such limit.
# -static-* still statically links the MinGW runtime so the .exe runs on
# machines without MinGW installed (no libgcc_s_seh-1.dll / libstdc++-6.dll /
# libwinpthread-1.dll dependency).
[target.x86_64-pc-windows-gnu]
rustflags = [
  "-C", "link-arg=-fuse-ld=lld",
  "-C", "link-args=-static-libgcc -static-libstdc++ -static",
]
